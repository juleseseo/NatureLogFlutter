    - lib/ressources/nature_log_logo.jpg
    - resources/
  uses-material-design: true

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
